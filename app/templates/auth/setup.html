{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width:540px">
    <h2>Configurar administrador</h2>
    <p>Crea el acceso para esta instalación de Panda · Casa de Empeño.</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="ci">Usuario</label>
        <input class="form-control mb-3" id="ci" name="ci" maxlength="20" required autocomplete="username">
        <label class="form-label" for="nombre">Nombre</label>
        <input class="form-control mb-3" id="nombre" name="nombre" maxlength="100" required>
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control mb-3" type="password" id="password" name="password" minlength="8" required autocomplete="new-password">
        <button class="btn btn-primary" type="submit">Crear administrador</button>
    </form>
</div>
{% endblock %}
