{% extends "base.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center error-page">
    <div class="card p-5 text-center shadow-lg error-card error-500">
        <div class="error-icon mb-4">
            <i class="bi bi-shield-exclamation error-color-500"></i>
        </div>
        <h1 class="display-1 fw-bold mb-2 error-color-500">500</h1>
        <h2 class="h3 mb-4">Error Interno del Servidor</h2>
        <p class="mb-5">¡Ups! Algo salió mal de nuestro lado. Estamos trabajando para solucionarlo lo antes posible.</p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{{ url_for('public.index') }}" class="btn btn-danger btn-lg px-5">
                <i class="bi bi-house-fill me-2"></i> Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
