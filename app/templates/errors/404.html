{% extends "base.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center error-page">
    <div class="card p-5 text-center shadow-lg error-card error-404">
        <div class="error-icon mb-4">
            <i class="bi bi-exclamation-diamond-fill error-color-404"></i>
        </div>
        <h1 class="display-1 fw-bold mb-2 error-color-404">404</h1>
        <h2 class="h3 mb-4">Página No Encontrada</h2>
        <p class="mb-5">Lo sentimos, la página que estás buscando no existe o ha sido movida.</p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{{ url_for('public.index') }}" class="btn btn-primary btn-lg px-5">
                <i class="bi bi-house-fill me-2"></i> Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
