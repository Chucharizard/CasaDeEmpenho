[pytest]
# Directorio base del proyecto
testpaths = tests

# Mostrar info detallada por defecto
addopts =
    -v
    --tb=short
    --no-header
    -q

# Filtrar warnings que no nos interesan en tests
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy
    ignore::DeprecationWarning:sqlalchemy
    ignore::UserWarning
